# --- Server ---
server.port=8080

# --- Datasource: H2 in-memory (zero setup to run locally) ---
# We will swap this block for PostgreSQL once the basic app works end-to-end.
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console: visit http://localhost:8080/h2-console while app is running ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
